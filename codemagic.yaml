workflows:
  # Debug build workflow - for testing
  debug:
    name: Debug Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    
    environment:
      groups:
        - default
      vars:
        PACKAGE_NAME: "com.wakeup.app"
        
    scripts:
      - name: Setup Gradle Wrapper
        script: |
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          
      - name: Clean Build Cache
        script: |
          rm -rf ~/.gradle/caches/
          rm -rf .gradle/
          rm -rf app/build/
          rm -rf build/
          ./gradlew clean --no-configuration-cache
          ./gradlew cleanBuildCache || true
          
      - name: Download dependencies
        script: |
          ./gradlew dependencies
          
      - name: Run lint
        script: |
          ./gradlew lintDebug
          
      - name: Build debug APK
        script: |
          ./gradlew assembleDebug
          
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/reports/lint-results-debug.html
      
    publishing:
      email:
        recipients:
          - developer@example.com
        notify:
          success: true
          failure: true
